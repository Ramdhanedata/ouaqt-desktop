# Builds the phone app (/app) and the builder's preview (/app-preview) for
# the website, on a machine that can fetch every dependency, and keeps them
# with the run so they can be copied into the website repository.
name: Web builds

on:
  push:
    branches: [web-builds]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run
      - name: Build the phone app and the preview
        run: |
          mkdir -p out/public
          node scripts/build-phone.mjs out/public/app
          node scripts/build-web.mjs out/public/app-preview
      - name: Keep the builds on a branch, to copy into the website
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out/public
          git init -q -b web-builds-out
          git add -A
          git -c user.name="OUAQT CI" -c user.email="ci@ouaqt.invalid" commit -q -m "Phone app and preview built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" web-builds-out
