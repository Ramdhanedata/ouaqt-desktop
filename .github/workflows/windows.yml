# Every push builds a Windows installer you can download and run.
#
# What this runner can tell us: the types compile, the tests pass, the
# database behaves, and the app packages into an installer that exists.
#
# What it cannot: the spinning disk in the performance targets, a thermal
# printer, or two machines finding each other on a shop's network. Those need
# a real machine, and each milestone hand-off says which.
#
# The installer is unsigned, so Windows shows a blue "Windows protected your
# PC" box. Click "More info", then "Run anyway". That is expected until the
# code signing certificate exists, and the install video on the website says
# the same thing.
#
# Signing is ready to switch on and needs no change to this file. Add two
# repository secrets, WINDOWS_CSC_LINK (the .pfx, base64) and
# WINDOWS_CSC_KEY_PASSWORD, and the next push signs. Without them the values
# below are empty and electron-builder builds unsigned, as today.
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: The database, under Electron
        run: npm run check:db
        env:
          ELECTRON_RUN_AS_NODE: 1

      - name: Build both processes
        run: npm run build

      - name: Make the installer
        run: npx electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: OUAQT-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      # The sample configuration travels with the installer, so there is one
      # place to download and nothing to hunt for in the repository.
      - name: Upload the sample configuration
        uses: actions/upload-artifact@v4
        with:
          name: sample-configuration
          path: fixtures/configuration.*.json
          if-no-files-found: error
          retention-days: 30
