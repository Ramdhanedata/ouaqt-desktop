# Every push builds the macOS installers, one for Intel and one for Apple
# silicon.
#
# Signed and notarised when the Apple secrets exist, unsigned when they do
# not. Unsigned, macOS refuses the first open and the way through is a
# right-click and "Open", which is not something to ask of an owner who
# rarely touches a computer. That is why notarisation is on the launch
# checklist as a thing that must be done before the first real owner.
#
# The secrets, all repository secrets:
#
#   MAC_CSC_LINK                  the "Developer ID Application" certificate, .p12, base64
#   MAC_CSC_KEY_PASSWORD          its password
#   APPLE_ID                      the Apple ID that owns the developer account
#   APPLE_APP_SPECIFIC_PASSWORD   made at appleid.apple.com, not the account password
#   APPLE_TEAM_ID                 ten characters, from developer.apple.com
#
# All five or none. electron-builder refuses a half-configured notarisation
# rather than shipping something that looks signed and is not.
name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: The database, under Electron
        run: npm run check:db
        env:
          ELECTRON_RUN_AS_NODE: 1

      - name: Build both processes
        run: npm run build

      - name: Make the installers
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without a certificate, do not go looking for one in a keychain
          # that belongs to the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: OUAQT-mac-installers
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
